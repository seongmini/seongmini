<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 268" role="img" aria-labelledby="title description">
  <title id="title">TripTrace에서 같은 사진을 나누는 두 가지 방법</title>
  <desc id="description">가상 사진 다섯 장을 시간 기준으로는 1·2와 3·4·5, 거리 기준으로는 1·2·3과 4·5로 묶는다.</desc>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8f9f9d" opacity=".42"/>
    </pattern>
    <g id="points">
      <circle cx="60" cy="135" r="15"/>
      <circle cx="112" cy="104" r="15"/>
      <circle cx="161" cy="132" r="15"/>
      <circle cx="257" cy="154" r="15"/>
      <circle cx="306" cy="116" r="15"/>
    </g>
    <g id="numbers">
      <text x="60" y="141">1</text>
      <text x="112" y="110">2</text>
      <text x="161" y="138">3</text>
      <text x="257" y="160">4</text>
      <text x="306" y="122">5</text>
    </g>
    <style>
      .caption, .subtitle { font-family: system-ui, "Malgun Gothic", sans-serif; fill: #163233; }
      .caption { font-size: 24px; font-weight: 700; }
      .subtitle { font-size: 19px; }
      .numbers { font: 700 17px system-ui, sans-serif; fill: #153633; text-anchor: middle; }
      .group { stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .cut { stroke: #596c6e; stroke-width: 2; stroke-dasharray: 5 6; }
    </style>
  </defs>
  <rect x="1" y="1" width="798" height="266" rx="20" fill="#eef4f2" stroke="#9caead" stroke-width="2"/>
  <g transform="translate(20 20)">
    <rect width="370" height="228" rx="13" fill="#fff" stroke="#c4d0ce"/>
    <rect x="16" y="72" width="338" height="108" rx="8" fill="url(#grid)"/>
    <text x="20" y="37" class="caption">촬영 간격</text>
    <text x="20" y="61" class="subtitle">24시간으로 나누기</text>
    <path d="m112 104 49 28" class="cut"/>
    <path d="m60 135 52-31" class="group" stroke="#278475"/>
    <path d="m161 132 96 22 49-38" class="group" stroke="#b57844"/>
    <use href="#points" fill="#fff" stroke="#627574" stroke-width="2"/>
    <use href="#numbers" class="numbers"/>
    <text x="20" y="207" class="subtitle">여행 A  1·2     여행 B  3·4·5</text>
  </g>
  <g transform="translate(410 20)">
    <rect width="370" height="228" rx="13" fill="#fff" stroke="#c4d0ce"/>
    <rect x="16" y="72" width="338" height="108" rx="8" fill="url(#grid)"/>
    <text x="20" y="37" class="caption">촬영 위치</text>
    <text x="20" y="61" class="subtitle">50km로 나누기</text>
    <path d="m161 132 96 22" class="cut"/>
    <path d="m60 135 52-31 49 28" class="group" stroke="#278475"/>
    <path d="m257 154 49-38" class="group" stroke="#b57844"/>
    <use href="#points" fill="#fff" stroke="#627574" stroke-width="2"/>
    <use href="#numbers" class="numbers"/>
    <text x="20" y="207" class="subtitle">여행 A  1·2·3     여행 B  4·5</text>
  </g>
</svg>
